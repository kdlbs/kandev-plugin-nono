id: "kandev-plugin-nono"
api_version: 2
version: "0.1.0"
display_name: "Nono"
description: "Pinned Linux sandbox policy compiler and approval protocol for Kandev. Requires the experimental sandbox provider contract."
categories: ["tools"]
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
capabilities:
  sandbox_provider: true
sandbox_providers:
  - key: nono
    display_name: Nono
    protocol_major: 1
